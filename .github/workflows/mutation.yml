name: Mutation testing

# Unit tests answer "does the code work"; mutation testing answers the harder question: "would the tests
# notice if the code were wrong?". It is slow (minutes, not seconds), so it runs weekly and on demand -
# never on every push. A low score is reported, not fatal: the threshold that breaks the build is 0.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays, 03:00 UTC
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutate:
    name: mutate (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: domain
            project: SharpCoreLedgerSheets.Domain.Tests
          - scope: application
            project: SharpCoreLedgerSheets.Application.Tests
          - scope: reports
            project: SharpCoreLedgerSheets.Reports.Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore SharpCoreLedgerSheets.slnx

      # The configuration lives next to the test project (stryker-config.json): scope, thresholds,
      # reporters and the Microsoft.Testing.Platform runner the xunit.v3 projects need.
      - name: Mutation run (${{ matrix.scope }})
        working-directory: tests/${{ matrix.project }}
        run: dotnet stryker --config-file stryker-config.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.scope }}
          path: tests/${{ matrix.project }}/StrykerOutput/**/reports/*
          if-no-files-found: warn
